# Nginx-Konfiguration für den SmartMirror.
#
# Diese Datei ist eine Vorlage. Die Platzhalter __PHP_SOCKET__ und
# __PROJECT_DIR__ setzt deploy/setup.sh beim Einrichten automatisch ein -
# hier von Hand nichts ändern.

server {

    listen 80 default_server;
    listen [::]:80 default_server;

    server_name mirror mirror.local _;

    root __PROJECT_DIR__;
    index index.php;

    charset utf-8;

    # Zugriffs-Log aus: Der Spiegel fragt rund um die Uhr alle 10 Sekunden
    # den Refresh-Status ab. Das wären über 8000 Logzeilen pro Tag, die
    # sinnlos auf die SD-Karte geschrieben würden.
    access_log off;
    error_log /var/log/nginx/smartmirror-error.log warn;

    # Bilder aus der Kamera sind schnell größer als das Standardlimit
    client_max_body_size 32M;

    # --- Interna nicht ausliefern -------------------------------------
    # Muss vor dem PHP-Block stehen: Nginx nimmt die erste passende
    # Regex-Location, und danach wäre es zu spät.

    location ~ ^/(config|data|deploy|app)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # --- PHP -----------------------------------------------------------

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCKET__;
        fastcgi_read_timeout 30s;
    }

    # --- Statische Dateien ---------------------------------------------

    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
